<form action="/contact/contact.php" method="post"
      data-contact-form data-form-id="contact"
      data-endpoint="/contact/contact.php" data-config-endpoint="/contact/config.php">
    <p>
        <label for="contact-name">Nombre</label>
        <input id="contact-name" name="name" autocomplete="name" maxlength="150"
               aria-describedby="contact-name-error" required>
        <span id="contact-name-error" data-contact-error-for="name"></span>
    </p>
    <p>
        <label for="contact-email">Correo electrónico</label>
        <input id="contact-email" name="email" type="email" autocomplete="email"
               aria-describedby="contact-email-error" required>
        <span id="contact-email-error" data-contact-error-for="email"></span>
    </p>
    <p>
        <label for="contact-message">Mensaje</label>
        <textarea id="contact-message" name="message" maxlength="5000"
                  aria-describedby="contact-message-error" required></textarea>
        <span id="contact-message-error" data-contact-error-for="message"></span>
    </p>
    <div data-contact-turnstile></div>
    <button type="submit">Enviar mensaje</button>
    <p data-contact-feedback aria-live="polite"></p>
</form>
<script src="/contact/assets/contact.js" defer></script>
